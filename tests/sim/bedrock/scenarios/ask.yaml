# "Ask the network" (purpose ask / chat_ask) scenarios. Matching is on the question text (the last user message
# with text, including the server's "(Answer in English.)" wrapper). Highest priority wins; then file order.
# Tokens like [qa:loop] let E2E/pytest pick a scenario deterministically. See README.md for the format.
scenarios:
  # ---------------------------------------------------------------- example chips
  - name: problems_down
    purpose: [ask, chat_ask]
    match: '\b(down|problems?|failing|outage)\b'
    turns:
      - tool_use: [{name: list_problems, input: {}}]
      - text: |-
          {{ $.rows }} sensors are in a problem state:
          {{ $.data.items | each("- [{device_name} / {sensor_name}](nm:{ref}) is **{status}** since {since}") }}

          Devices: {{ $.data.items | each("[{device_name}](nm:{device_ref})") | default("none") }}
    final: 'Problems found: {{ $tool.list_problems.rows | default(0) }}.'

  - name: problems_down_he
    purpose: [ask, chat_ask]
    priority: 5
    match: '(למטה|תקלות|בעיות|נפל)'
    turns:
      - tool_use: [{name: search_devices, input: {status: [down, unreachable, warning]}}]
      - text: |-
          נמצאו {{ $.rows }} מכשירים עם תקלה:
          {{ $.data.items | each("- [{name}](nm:{ref}) — כתובת {host} — מצב {status}") }}

          כדי לבדוק, הרץ `ping {{ $.data.items[0].host | default("10.0.0.1") }}` מהשרת.

  - name: device_history
    purpose: [ask, chat_ask]
    match: 'what happened (on|to) ([\w.-]+)'
    turns:
      - tool_use: [{name: search_devices, input: {query: '{{ $question | re("happened (?:on|to) ([\w.-]+)") }}'}}]
      - tool_use: [{name: list_events, input: {device_id: '{{ $.data.items[0].id }}', since: '{{ $day_ago }}', until: '{{ $now }}'}}]
      - text: |-
          [{{ $tool.search_devices.data.items[0].name }}](nm:{{ $tool.search_devices.data.items[0].ref }}) had {{ $.rows }} events in the last 24 h:
          {{ $.data.items | take(10) | each("- {time} [{kind}](nm:{ref}) {old_status} → {new_status}: {message}") }}

  - name: syslog_search
    purpose: [ask, chat_ask]
    match: '\b(syslog|log messages?|logs)\b'
    turns:
      - tool_use: [{name: search_syslog, input: {since: '{{ $day_ago }}', until: '{{ $now }}', limit: 20}}]
        if_not_offered:
          text: 'Syslog is turned off in NetworkMonitor, so I cannot search log messages. An administrator can enable it under Settings → Features.'
      - text: |-
          The last {{ $.rows }} syslog messages:
          {{ $.data.items | take(10) | each("- [{time}](nm:{ref}) {device_name}: {message}") }}

  - name: traps_search
    purpose: [ask, chat_ask]
    match: '\btraps?\b'
    turns:
      - tool_use: [{name: search_traps, input: {since: '{{ $day_ago }}', until: '{{ $now }}'}}]
        if_not_offered: {text: 'SNMP traps are turned off in NetworkMonitor.'}
      - text: '{{ $.rows }} traps: {{ $.data.items | take(5) | each("[{trap_name}](nm:{ref})") }}'

  - name: config_diff
    purpose: [ask, chat_ask]
    match: '\bconfig(uration)?\b.*\b(diff|change|changes)\b|\[qa:config-diff\]'
    turns:
      - tool_use: [{name: config_diff, input: {device_id: '{{ $question | re("device #?(\d+)") | int | default(1) }}'}}]
        if_not_offered: {text: 'Configuration backups are not available to me (the feature or the "send config excerpts" option is off).'}
      - text: |-
          Latest configuration change of [the device](nm:{{ $.data.ref | default("config/0/0") }}): {{ $.data.added | default("?") }} lines added, {{ $.data.removed | default("?") }} removed.
          ```diff
          {{ $.data.diff | default("(no diff in the result)") }}
          ```

  - name: config_search
    purpose: [ask, chat_ask]
    match: '\[qa:config-search\]|which devices have .* in (the|their) config'
    turns:
      - tool_use: [{name: config_search, input: {text: '{{ $question | re("text \"([^\"]+)\"") | default("snmp") }}'}}]
        if_not_offered: {text: 'Configuration search is not available (configuration backups are off or not shared).'}
      - text: '{{ $.data.items | each("- [{device_name}](nm:{device_ref})") }}'

  - name: mac_search
    purpose: [ask, chat_ask]
    match: '((?:[0-9a-f]{2}[:-]){5}[0-9a-f]{2})'
    turns:
      - tool_use: [{name: find_mac_or_ip, input: {mac: '{{ $question | re("((?:[0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2})") }}'}}]
      - text: '{{ $.data.items | each("{mac} is on [{device_name}](nm:{device_ref}) port [{port_name}](nm:{port_ref}) VLAN {vlan}, last seen {last_seen}") | default("Not found.") }}'

  - name: ip_search
    purpose: [ask, chat_ask]
    match: 'where is .*?((?:\d{1,3}\.){3}\d{1,3}|IP-\d+)'
    turns:
      - tool_use: [{name: find_mac_or_ip, input: {ip: '{{ $question | re("((?:\d{1,3}\.){3}\d{1,3}|IP-\d+)") }}'}}]
      - text: '{{ $question | re("((?:\d{1,3}\.){3}\d{1,3}|IP-\d+)") }}: {{ $.data.items | each("{ip} ({mac}) on [{device_name}](nm:{device_ref}) port {port_name}") | default("not found") }}'

  - name: availability
    purpose: [ask, chat_ask]
    match: '\bavailability\b|זמינות'
    turns:
      - tool_use: [{name: availability, input: {since: '{{ $month_ago }}', until: '{{ $now }}'}}]
      - text: '{{ $.data.items | take(10) | each("- [{name}](nm:{ref}): {availability_pct} %") }}'

  - name: top_talkers
    purpose: [ask, chat_ask]
    match: '\btop talkers?\b|\bbandwidth\b'
    turns:
      - tool_use: [{name: flow_top, input: {kind: talkers, since: '{{ $hour_ago }}', until: '{{ $now }}'}}]
        if_not_offered: {text: 'Flow analysis is turned off in NetworkMonitor.'}
      - text: '{{ $.data.items | take(5) | each("- {hostname} {bytes} bytes") }}'

  - name: knowledge
    purpose: [ask, chat_ask]
    match: '\b(runbook|knowledge|procedure|documentation)\b|נוהל'
    turns:
      - tool_use: [{name: search_knowledge, input: {query: 'core switch replacement runbook'}}]
        if_not_offered: {text: 'The knowledge base is not enabled in NetworkMonitor.'}
      - text: |-
          According to [{{ $.data.items[0].title }}](nm:{{ $.data.items[0].ref }}): {{ $.data.items[0].text }}

          Other sources: {{ $.data.items | each("[{title}](nm:{ref})") }}

  # ---------------------------------------------------------------- loop shapes
  - name: three_rounds
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:3rounds\]|\binvestigate\b'
    turns:
      - text_before: 'Let me check the current problems first.'
        tool_use: [{name: list_problems, input: {}}]
      - text_before: 'Now the device of the first problem.'
        tool_use: [{name: get_device, input: {device_id: '{{ $.data.items[0].device_id | default(1) }}'}}]
      - tool_use: [{name: topology_neighbors, input: {device_id: '{{ $tool.get_device.data.id | default(1) }}'}}]
      - text: |-
          [{{ $tool.get_device.data.name }}](nm:{{ $tool.get_device.data.ref }}) has {{ $tool.topology_neighbors.rows | default(0) }} neighbours; {{ $tool.list_problems.rows }} problems in total.

  - name: one_round_no_tools
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:notools\]|what is (an? )?(vlan|lacp|lldp|ospf)'
    turns:
      - text: 'A VLAN is a logical broadcast domain on a switch. (No monitoring data was needed for this answer.)'

  - name: parallel_tools
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:parallel\]'
    turns:
      - tool_use:
          - {name: list_problems, input: {}}
          - {name: list_maintenance, input: {active_only: true}}
          - {name: list_groups, input: {}}
      - text: '{{ $tool.list_problems.rows }} problems, {{ $tool.list_maintenance.rows }} maintenance windows, {{ $tool.list_groups.rows }} groups.'

  - name: tool_error_retry
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:retry\]'
    turns:
      - tool_use: [{name: get_device, input: {device_id: 'not-a-number'}}]
      - tool_use: [{name: list_problems, input: {}}]
      - text: 'First lookup failed with {{ $tool.get_device.error | default("?") }}; after retrying: {{ $tool.list_problems.rows }} problems.'

  - name: loop_tools
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:loop\]'
    turns:
      - tool_use: [{name: list_problems, input: {}}]
        repeat: true
    final: 'I stopped after {{ $all | len }} lookups. Problems: {{ $tool.list_problems.rows | default(0) }}.'

  - name: loop_parallel
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:loop-parallel\]'
    turns:
      - tool_use:
          - {name: list_problems, input: {}}
          - {name: list_groups, input: {}}
          - {name: search_devices, input: {}}
          - {name: list_maintenance, input: {}}
        repeat: true
    final: 'I stopped after {{ $all | len }} lookups.'

  - name: max_tokens
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:maxtokens\]'
    turns:
      - text: 'This answer is cut by the output token limit. '
        stop_reason: max_tokens

  - name: long_stream
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:long\]'
    stream: {chunk_chars: 6, delay_ms: 120}
    turns:
      - text: |-
          This is a deliberately long streamed answer used by the Stop and re-attach tests. Line 01 of the answer explains nothing in particular.
          Line 02: the mock streams six characters every 120 milliseconds so that the answer takes about a minute to finish.
          Line 03: closing the tab must not cancel the run; the Stop button must cancel it within one second.
          Line 04: re-attaching with Last-Event-ID must replay the buffered events and continue live.
          Line 05: the partial text must be stored with status cancelled when the admin presses Stop.
          Line 06: usage must count the tokens that were consumed before the cancel.
          Line 07: the end.

  - name: slow_first_round
    purpose: [ask, chat_ask]
    priority: 10
    match: '\[qa:slowtool\]'
    stream: {first_delay_ms: 3000}
    turns:
      - tool_use: [{name: list_problems, input: {}}]
      - text: 'Done after a slow first round: {{ $.rows }} problems.'

  # ---------------------------------------------------------------- conversation behaviour
  - name: followup
    purpose: [ask, chat_ask]
    priority: 3
    match: '\b(and the|what about|follow-?up)\b|ומה עם'
    turns:
      - tool_use: [{name: list_problems, input: {}}]
      - text: 'Following up on the earlier answer: still {{ $.rows }} problems.'

  - name: offtopic
    purpose: [ask, chat_ask]
    priority: 3
    match: '\b(poem|recipe|weather|joke|football)\b'
    turns:
      - text: 'I can only help with questions about this network and its monitoring data.'

  - name: ask_default
    purpose: [ask, chat_ask]
    priority: -10
    turns:
      - tool_use: [{name: list_problems, input: {limit: 5}}]
      - text: 'I looked at the current problems ({{ $.rows }}). Ask me about devices, sensors, events or logs.'
