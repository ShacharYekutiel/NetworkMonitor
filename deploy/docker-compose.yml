# NetworkMonitor — production stack (TimescaleDB + app).
#
# The only step (from the repository root):
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# then open http://<server>:8080 and complete the setup wizard.
# SNMP traps (UDP 162) and syslog (UDP+TCP 514) are published too; they are received only
# after an administrator turns them on in Settings -> Features (deploy/README.md,
# "Traps and syslog"; Docker Desktop loses the sender IP - see there).
# [3] So are NetFlow/IPFIX (UDP 2055), IPFIX (UDP 4739) and sFlow (UDP 6343): received only
# while the Flows feature is ON (deploy/README.md, "Flows").
# After a `git pull`, update with: docker compose -f deploy/docker-compose.yml up -d --build
#
# Nothing has to be edited. The DB password is generated on the first `up` by the
# one-shot `init` service and stored in the `netmon-data` volume (/data/db_password).
# Optional overrides (port, image names) go in deploy/.env — see deploy/.env.example.

name: netmon

# [1.4.2] Container hardening (docs/production.md "[1.4.2] Container hardening"): no Linux
# capability beyond what a service needs, no privilege gain (no-new-privileges), read-only
# root filesystem (writable: volumes + a small /tmp), resource limits. To relax an item for a
# special setup, put the change in a compose override file (docker-compose.override.yml)
# instead of editing this one.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

services:
  # One-shot: create the shared data volume layout and a random DB password if absent.
  init:
    image: ${NETMON_INIT_IMAGE:-busybox:1.37}
    restart: "no"
    network_mode: none
    <<: *hardening
    # root, but only to create / chown the shared files: no other capability
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    tmpfs:
      - /tmp:size=16m,mode=1777  # ops/restore.sh keeps db_password there while extracting
    mem_limit: 64m
    pids_limit: 64
    volumes:
      - netmon-data:/data
    environment:
      # Must match the image's runtime user (Dockerfile NETMON_UID/NETMON_GID) and the
      # postgres user of the timescale image (uid/gid 70 on the Alpine-based images).
      APP_UID: "10001"
      PG_GID: "70"
    command:
      - sh
      - -euc
      - |
        umask 077
        if [ ! -s /data/db_password ]; then
          tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40 > /data/db_password.tmp
          [ "$$(wc -c < /data/db_password.tmp)" -eq 40 ]
          mv /data/db_password.tmp /data/db_password
          echo "init: generated a new database password"
        else
          echo "init: database password already present"
        fi
        # /data belongs to the app user; postgres may only read db_password (group).
        chown "$$APP_UID:$$PG_GID" /data /data/db_password
        chmod 0750 /data
        chmod 0640 /data/db_password

  db:
    image: ${NETMON_DB_IMAGE:-timescale/timescaledb:2.31.0-pg16}
    restart: unless-stopped
    # [1.4.2] runs directly as the image's postgres user (alpine images: 70:70, the owner of
    # the data directory): no capability needed. A Debian-based PostgreSQL image uses
    # 999 - set NETMON_DB_UID / NETMON_DB_GID in deploy/.env.
    user: "${NETMON_DB_UID:-70}:${NETMON_DB_GID:-70}"
    <<: *hardening
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=8m,uid=${NETMON_DB_UID:-70},gid=${NETMON_DB_GID:-70},mode=0775
    pids_limit: 1024
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: netmon
      POSTGRES_DB: netmon
      POSTGRES_PASSWORD_FILE: /run/netmon/db_password
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - netmon-db:/var/lib/postgresql/data
      - netmon-data:/run/netmon:ro
    # Not published to the host on purpose (only the app talks to it).
    healthcheck:
      # TCP check: during first-time init the server only listens on the unix socket,
      # so this does not report healthy before initialization has finished.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U netmon -d netmon"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    shm_size: 256mb

  netmon:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NETMON_NODE_IMAGE:-node:22-slim}
        PYTHON_IMAGE: ${NETMON_PYTHON_IMAGE:-python:3.12-slim}
    image: ${NETMON_IMAGE:-networkmonitor:local}
    restart: unless-stopped
    # [1.4.2] non-root (uid 10001) with NO capability: unprivileged ICMP sockets (sysctl
    # below), receivers on ports > 1024 inside the container; writes to /data and /tmp only.
    <<: *hardening
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: ${NETMON_MEM_LIMIT:-4g}
    pids_limit: 2048
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://netmon@db:5432/netmon
      NETMON_DB_PASSWORD_FILE: /data/db_password
      NETMON_DATA_DIR: /data
      NETMON_PORT: "8080"
      # [2b-3] SNMP trap / syslog receivers inside the container (must match `ports:`).
      # They listen only while the Traps / Syslog features are ON (Settings -> Features).
      NETMON_TRAP_PORT: "1162"
      NETMON_SYSLOG_PORT: "1514"
      NETMON_SYSLOG_TCP_PORT: "1514"
      # [3] Flow receivers (Flows feature): > 1024, so published 1:1 (must match `ports:`).
      NETMON_NETFLOW_PORT: "2055"
      NETMON_IPFIX_PORT: "4739"
      NETMON_SFLOW_PORT: "6343"
      TZ: ${TZ:-UTC}
    volumes:
      - netmon-data:/data
      # Corporate root CAs (TLS-inspecting firewalls): trusted at runtime, so a prebuilt
      # image from ghcr.io works too. See deploy/certs/README.md.
      - ./certs:/etc/netmon/certs:ro
    ports:
      - "${NETMON_HTTP_PORT:-8080}:8080"
      # [2b-3] SNMP traps (UDP 162) and syslog (UDP + TCP 514) on the standard host ports;
      # change them in deploy/.env (NETMON_TRAP_HOST_PORT / NETMON_SYSLOG_HOST_PORT) if
      # something else on the host already uses them (snmptrapd, rsyslog, Windows SNMPTRAP).
      # Linux Docker Engine keeps the sender's IP for traffic from other machines.
      # Docker Desktop (Windows/macOS) does NOT: every message then seems to come from one
      # internal address and the Logs page shows a NAT warning. Test traps/syslog on Linux
      # or with the native Windows installer instead (deploy/README.md).
      - "${NETMON_TRAP_HOST_PORT:-162}:1162/udp"
      - "${NETMON_SYSLOG_HOST_PORT:-514}:1514/udp"
      - "${NETMON_SYSLOG_HOST_PORT:-514}:1514/tcp"
      # [3] Flow export (NetFlow v5/v9 + IPFIX, IPFIX, sFlow v5). Same source-IP notes as above
      # (exporters are identified by their address). Override the host side in deploy/.env
      # (NETMON_NETFLOW_HOST_PORT / NETMON_IPFIX_HOST_PORT / NETMON_SFLOW_HOST_PORT) if a
      # collector (nfcapd, pmacct, ...) already uses them.
      - "${NETMON_NETFLOW_HOST_PORT:-2055}:2055/udp"
      - "${NETMON_IPFIX_HOST_PORT:-4739}:4739/udp"
      - "${NETMON_SFLOW_HOST_PORT:-6343}:6343/udp"
    # Unprivileged ICMP (ping) for every GID inside the container.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  netmon-db:
  netmon-data:
