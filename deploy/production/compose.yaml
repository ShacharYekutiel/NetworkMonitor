# NetworkMonitor — PRODUCTION stack (GitOps). Do not run by hand on the server unless
# you know why: ops/sync.sh (systemd timer netmon-gitops.timer) applies it.
#
#   docker compose --project-directory /opt/netmon/deploy/production \
#     -f compose.yaml --env-file release.env config -q
#
# Based on deploy/docker-compose.yml (same init / db / netmon services and volume names),
# with: the image pinned by release.env (no build), the web UI not published directly, a
# Caddy reverse proxy terminating HTTPS on 443 (80 -> 443 redirect), the SNMP trap /
# syslog receivers published on the standard ports 162/udp and 514/udp+tcp [2b-3], and the
# flow receivers on 2055/udp (NetFlow/IPFIX), 4739/udp (IPFIX), 6343/udp (sFlow) [3].
#
# Host paths (root-only, never in git):
#   ${NETMON_ETC_DIR:-/etc/netmon-gitops}/tls/{cert.pem,key.pem}  TLS cert (full chain) + key
#   ${NETMON_ETC_DIR:-/etc/netmon-gitops}/site.env                NETMON_FQDN for Caddy
#   ${NETMON_ETC_DIR:-/etc/netmon-gitops}/app.env                 optional app overrides
#   ${NETMON_ETC_DIR:-/etc/netmon-gitops}/ca/                     corporate CAs for the app
#   ${NETMON_ETC_DIR:-/etc/netmon-gitops}/aws/                    [3b] optional Roles Anywhere cert/key
#
# Production NEVER uses ":latest" — NETMON_IMAGE comes from release.env and is checked by
# ops/check-release.sh (exact version, optional @sha256 digest).

name: netmon

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# [1.4.2] Container hardening (docs/production.md "[1.4.2] Container hardening"): every
# service drops ALL Linux capabilities and adds back only what it needs, cannot gain
# privileges (no-new-privileges: setuid/file capabilities are ignored), runs with a read-only
# root filesystem (writable: its volumes and a small /tmp tmpfs) and has resource limits.
# The limits are defaults sized well above normal use; change them here (PR) if a large
# installation needs more. The database has no memory limit on purpose: its shared_buffers
# were tuned to the host's RAM when it was created, a lower cap would get it OOM-killed.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

services:
  # One-shot: create the shared data volume layout and a random DB password if absent.
  # (Identical to deploy/docker-compose.yml.)
  init:
    image: busybox:1.37
    restart: "no"
    network_mode: none
    <<: *hardening
    # root, but only to create / chown the shared files: no other capability
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    tmpfs:
      - /tmp:size=16m,mode=1777  # ops/restore.sh keeps db_password there while extracting
    mem_limit: 64m
    pids_limit: 64
    volumes:
      - netmon-data:/data
    environment:
      APP_UID: "10001"
      PG_GID: "70"
    command:
      - sh
      - -euc
      - |
        umask 077
        if [ ! -s /data/db_password ]; then
          tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40 > /data/db_password.tmp
          [ "$$(wc -c < /data/db_password.tmp)" -eq 40 ]
          mv /data/db_password.tmp /data/db_password
          echo "init: generated a new database password"
        else
          echo "init: database password already present"
        fi
        chown "$$APP_UID:$$PG_GID" /data /data/db_password
        chmod 0750 /data
        chmod 0640 /data/db_password
    logging: *logging

  db:
    image: timescale/timescaledb:2.31.0-pg16
    restart: unless-stopped
    # [1.4.2] runs directly as the image's postgres user (uid/gid 70, the owner of the data
    # directory) instead of starting as root and switching: no capability needed at all.
    user: "70:70"
    <<: *hardening
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=8m,uid=70,gid=70,mode=0775
    pids_limit: 1024
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: netmon
      POSTGRES_DB: netmon
      POSTGRES_PASSWORD_FILE: /run/netmon/db_password
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - netmon-db:/var/lib/postgresql/data
      - netmon-data:/run/netmon:ro
    # Not published to the host (only the app talks to it).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U netmon -d netmon"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    shm_size: 256mb
    stop_grace_period: 60s
    logging: *logging

  netmon:
    image: ${NETMON_IMAGE:?NETMON_IMAGE is not set - pass --env-file release.env}
    restart: unless-stopped
    # [1.4.2] Non-root (uid 10001, from the image) and NO capability: ICMP uses unprivileged
    # ping sockets (the sysctl below), the receivers listen on ports > 1024 inside the
    # container (Docker publishes 162/514), SSH / LDAP / Kerberos / HTTPS are plain
    # outbound sockets. Writes go to /data (volume) and /tmp (tmpfs) only.
    <<: *hardening
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 4g
    pids_limit: 2048
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    env_file:
      - path: ./config/settings.env
      - path: ${NETMON_ETC_DIR:-/etc/netmon-gitops}/app.env
        required: false
    environment:
      DATABASE_URL: postgresql://netmon@db:5432/netmon
      NETMON_DB_PASSWORD_FILE: /data/db_password
      NETMON_DATA_DIR: /data
      NETMON_PORT: "8080"
      # [2b-3] Receiver ports inside the container; must match `ports:` below.
      NETMON_TRAP_PORT: "1162"
      NETMON_SYSLOG_PORT: "1514"
      NETMON_SYSLOG_TCP_PORT: "1514"
      # [3] Flow receivers (Flows feature); published 1:1 below.
      NETMON_NETFLOW_PORT: "2055"
      NETMON_IPFIX_PORT: "4739"
      NETMON_SFLOW_PORT: "6343"
      # Behind Caddy: trust X-Forwarded-* (Caddy overwrites client-supplied ones) and
      # always mark the session cookie Secure (the site is HTTPS-only).
      NETMON_TRUST_PROXY: "true"
      NETMON_COOKIE_SECURE: "true"
      # Test hooks must never be enabled in production.
      NETMON_TEST_MODE: "false"
      NETMON_DEV: "false"
    volumes:
      - netmon-data:/data
      # Corporate root CAs (TLS-inspecting proxy) trusted by the app at runtime.
      - ${NETMON_ETC_DIR:-/etc/netmon-gitops}/ca:/etc/netmon/certs:ro
      # [3b] Optional host files for the assistant's IAM Roles Anywhere certificate (only
      # when app.env sets NETMON_AWS_RA_CERT_FILE=/etc/netmon/aws/...; the default is the
      # certificate uploaded in Settings -> Assistant, stored encrypted in the DB).
      - ${NETMON_ETC_DIR:-/etc/netmon-gitops}/aws:/etc/netmon/aws:ro
    # The web UI/API is reachable only through Caddy (8080 is not published).
    expose:
      - "8080"
    # [2b-3] Inbound SNMP traps and syslog. Published with iptables DNAT (Docker's default
    # bridge networking), which keeps the sender's source IP for traffic from other
    # machines, so messages are attributed to the right device. The app (non-root) listens
    # on 1162 / 1514 inside the container, and ONLY while the owner has turned the Traps /
    # Syslog feature on in Settings -> Features (no server change needed to turn them on).
    # ufw does NOT filter these ports; see README.md "Traps and syslog" (DOCKER-USER,
    # ops/ingest-firewall.sh) to restrict which networks may send.
    ports:
      - "162:1162/udp"   # SNMP traps (and v2c informs)
      - "514:1514/udp"   # syslog
      - "514:1514/tcp"   # syslog (RFC 6587 framing)
      # [3] Flow export, same DNAT / source-IP / DOCKER-USER notes as above; nothing listens
      # until the owner turns the Flows feature on (Settings -> Features).
      - "2055:2055/udp"  # NetFlow v5/v9 and IPFIX
      - "4739:4739/udp"  # IPFIX (IANA port)
      - "6343:6343/udp"  # sFlow v5
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s
    stop_grace_period: 20s
    logging: *logging

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    # [1.4.2] uid 0 with ONE capability, NET_BIND_SERVICE (80/443; the image's caddy binary
    # carries it as a file capability and cannot even start without it): it reads the
    # root-only TLS key and writes its root-owned volumes as their owner, nothing else.
    # A non-root user needs the host key readable by that user first (docs/production.md
    # "[1.4.2] Container hardening", left for a later release).
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      - netmon
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - path: ${NETMON_ETC_DIR:-/etc/netmon-gitops}/site.env
        required: false
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NETMON_ETC_DIR:-/etc/netmon-gitops}/tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # [1.4.2] the admin API is off; a health listener inside the container only
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8099/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging: *logging

volumes:
  netmon-db:
  netmon-data:
  caddy-data:
  caddy-config:
