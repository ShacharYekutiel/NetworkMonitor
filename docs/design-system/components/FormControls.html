<!doctype html>
<html>
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../kit.css"><script>if(!/light/.test(location.hash))document.documentElement.classList.add("dark")</script><meta charset="utf-8"><title>FormControls</title></head>
<body>
<div style="padding:16px;display:flex;flex-direction:column;gap:14px"><div class="nm-form"><label class="nm-field "><span>Name<i>*</i></span><input class="nm-input" type="text" value="core-sw-01" placeholder=""></label><label class="nm-field "><span>Host<i>*</i></span><input class="nm-input mono" type="text" value="10.20.0.2" placeholder="" dir="ltr"><small>Hostname, IPv4 or IPv6 address</small></label><label class="nm-field "><span>Device class</span><select class="nm-select"><option>Switch</option></select></label><label class="nm-field "><span>Interval (s)</span><input class="nm-input mono" type="text" value="" placeholder="Empty = the default interval from Settings" dir="ltr"></label><label class="nm-field err"><span>OID</span><input class="nm-input mono" type="text" value="1.3.6.1.2.1.1.3" placeholder="" dir="ltr"><small>Numeric dotted OID, e.g. 1.3.6.1.2.1.1.3.0 (MIB names are not accepted).</small></label><label class="nm-field "><span>SNMP community</span><div class="nm-secret"><input class="nm-input" value="••••••••" disabled><button class="nm-btn secondary" >Replace</button></div><small>Write-only: never shown again.</small></label><div class="full row" style="gap:20px"><label class="nm-check"><input type="checkbox" checked>Enabled (monitoring active)</label><label class="nm-check"><input type="checkbox">Verify TLS certificate</label><span class="row"><span class="nm-switch on"></span><span style="font-size:13px">Reverse DNS</span></span><span class="row"><span class="nm-switch"></span><span style="font-size:13px" class="muted">Notify on new hosts</span></span></div></div></div>
</body>
</html>
