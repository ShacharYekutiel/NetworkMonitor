<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Network Monitor — premium prototype</title></head><body>
<title>Network Monitor Premium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: the device is the hero (product shot), quick actions under it, inset-grouped lists beside it.
   Calm neutrals, one ink colour for controls, status colours only for status. */
:root {
  --bg: #f5f5f7; --bg2: #ececef; --card: #ffffff; --card2: #f9f9fb; --ink: #1d1d1f; --ink2: #6e6e73; --ink3: #8e8e93; --line: rgba(0, 0, 0, .08); --line2: rgba(0, 0, 0, .14);
  --btn: #1d1d1f; --btn-ink: #ffffff; --chip: rgba(0, 0, 0, .05); --shadow: 0 1px 1px rgba(0, 0, 0, .03), 0 4px 10px rgba(0, 0, 0, .03), 0 18px 40px rgba(0, 0, 0, .05);
  --up: #28a745; --warn: #e88a00; --down: #e5372b; --unreach: #8e5cd9; --paused: #8e8e93;
  --up-bg: rgba(40, 167, 69, .1); --warn-bg: rgba(232, 138, 0, .12); --down-bg: rgba(229, 55, 43, .1);
  --stage: radial-gradient(46% 62% at 50% 0%, #ffffff 0%, rgba(255, 255, 255, 0) 100%), linear-gradient(180deg, #e9e9ee 0%, #f5f5f7 58%, #e4e4e9 100%); --floor: rgba(0, 0, 0, .22); --spec: rgba(255, 255, 255, .9); --page: linear-gradient(180deg, #fbfbfd, #f5f5f7 420px);
  --island: #000000; --island-ink: #ffffff;
  --f: "Heebo", "Inter", -apple-system, system-ui, sans-serif; --fn: "Inter", -apple-system, system-ui, sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --bg2: #0d0d0f; --card: #1c1c1e; --card2: #232326; --ink: #f5f5f7; --ink2: #a1a1a6; --ink3: #7c7c80; --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .16);
  --btn: #f5f5f7; --btn-ink: #000000; --chip: rgba(255, 255, 255, .08); --shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 1px rgba(255, 255, 255, .04);
  --up: #32d74b; --warn: #ff9f0a; --down: #ff453a; --unreach: #bf5af2; --paused: #98989d;
  --up-bg: rgba(50, 215, 75, .14); --warn-bg: rgba(255, 159, 10, .16); --down-bg: rgba(255, 69, 58, .16);
  --stage: radial-gradient(42% 62% at 50% 0%, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, 0) 100%), linear-gradient(180deg, #0b0b0d 0%, #000 60%, #060607 100%); --floor: rgba(0, 0, 0, .85); --spec: rgba(255, 255, 255, .5); --page: #000;
  --island: #1c1c1e; --island-ink: #f5f5f7; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --bg2: #0d0d0f; --card: #1c1c1e; --card2: #232326; --ink: #f5f5f7; --ink2: #a1a1a6; --ink3: #7c7c80; --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .16);
  --btn: #f5f5f7; --btn-ink: #000000; --chip: rgba(255, 255, 255, .08); --shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 1px rgba(255, 255, 255, .04);
  --up: #32d74b; --warn: #ff9f0a; --down: #ff453a; --unreach: #bf5af2; --paused: #98989d;
  --up-bg: rgba(50, 215, 75, .14); --warn-bg: rgba(255, 159, 10, .16); --down-bg: rgba(255, 69, 58, .16);
  --stage: radial-gradient(42% 62% at 50% 0%, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, 0) 100%), linear-gradient(180deg, #0b0b0d 0%, #000 60%, #060607 100%); --floor: rgba(0, 0, 0, .85); --spec: rgba(255, 255, 255, .5); --page: #000;
  --island: #1c1c1e; --island-ink: #f5f5f7; color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page, var(--bg)); color: var(--ink); font: 400 15px/1.45 var(--f); -webkit-font-smoothing: antialiased; transition: background-color .4s, color .4s; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 10px; }
.num { font-family: var(--fn); font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* top bar + dynamic island */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: saturate(1.8) blur(20px); -webkit-backdrop-filter: saturate(1.8) blur(20px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; font: 600 16px var(--fn); letter-spacing: -.01em; direction: ltr; justify-self: start; }
.brand svg { width: 26px; height: 26px; }
.island { justify-self: center; height: 36px; min-width: 150px; padding: 0 16px; border-radius: 999px; background: var(--island); color: var(--island-ink); display: flex; align-items: center; justify-content: center; gap: 10px; font: 500 13.5px var(--f); box-shadow: 0 4px 18px rgba(0, 0, 0, .18); transition: min-width .6s var(--ease), height .6s var(--ease), background-color .4s; overflow: hidden; white-space: nowrap; }
.island .d { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 10px var(--up); }
.island.alert { min-width: 360px; height: 44px; }
.island.alert .d { background: var(--down); box-shadow: 0 0 12px var(--down); animation: beat 1.2s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.5); opacity: .6; } }
.island .x { font: 500 12px var(--fn); opacity: .6; }
.tools { justify-self: end; display: flex; align-items: center; gap: 6px; }
.round { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--ink2); transition: background-color .2s, color .2s; }
.round:hover { background: var(--chip); color: var(--ink); }
.me { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #8e8e93, #3a3a3c); color: #fff; display: inline-flex; align-items: center; justify-content: center; font: 600 13px var(--fn); margin-inline-start: 6px; }

/* views + push transition */
.views { position: relative; max-width: 1240px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 8px 64px; }
.view { display: none; }
.view.on { display: block; }
.back { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 10px 0 4px; margin-inline-start: -8px; border-radius: 10px; color: var(--ink); font-weight: 500; }
.back:hover { background: var(--chip); }
.back .ico { transform: scaleX(-1); }

/* home: centred title, full-width product stage with a floor reflection, round actions under it */
.home { display: grid; gap: 0; grid-template-columns: minmax(0, 1fr); }
.hero-t { text-align: center; display: grid; justify-items: center; gap: 6px; padding-top: 18px; }
.site { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; background: var(--chip); font: 500 14px var(--f); color: var(--ink2); }
.headline { margin: 10px 0 0; font: 600 clamp(44px, 6vw, 76px)/1 var(--f); letter-spacing: -.035em; }
.headline .n { font-family: var(--fn); font-weight: 600; color: var(--down); }
.subline { margin: 6px 0 0; color: var(--ink2); font-size: 17px; }
.stage { position: relative; margin-top: 8px; border-radius: 36px; background: var(--stage); height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.stage.full { margin-inline: calc(-1 * max(24px, env(safe-area-inset-left, 0px))); border-radius: 0; background: transparent; height: 560px; justify-content: flex-start; padding-top: 64px; }
.stage.full::before { content: ""; position: absolute; inset: 0; background: var(--stage); -webkit-mask: radial-gradient(ellipse 62% 58% at 50% 46%, #000 40%, transparent 100%); mask: radial-gradient(ellipse 62% 58% at 50% 46%, #000 40%, transparent 100%); }
.stack { --rx: 0deg; --ry: 0deg; position: relative; width: min(1000px, 86%); display: grid; gap: 14px; transform-style: preserve-3d; transform: rotateX(calc(-13deg + var(--rx))) rotateY(calc(-21deg + var(--ry))); transform-origin: 50% 50%; transition: transform 1.1s var(--ease); z-index: 1; }
.stack::after { display: none; }
.rig { position: relative; width: min(820px, 68%); z-index: 1; perspective: 2600px; perspective-origin: 50% 20%; }
.rig::after { content: ""; position: absolute; left: 4%; right: -6%; bottom: -70px; height: 60px; border-radius: 50%; background: var(--floor); filter: blur(26px); z-index: -1; }
.rig .stack { width: 100%; }
.mirror { position: absolute; left: 0; right: 0; top: calc(100% + 10px); height: 100%; pointer-events: none; overflow: hidden; -webkit-mask: linear-gradient(rgba(0, 0, 0, .55), transparent 75%); mask: linear-gradient(rgba(0, 0, 0, .55), transparent 75%); }
.flip { display: grid; gap: 9px; transform: perspective(1700px) rotateX(calc(-12deg - var(--rx, 0deg))) rotateY(var(--ry, 0deg)) scaleY(-1); transform-origin: 50% 50%; transform-box: border-box; opacity: .5; filter: blur(1px); transition: transform .9s var(--ease); }
.mirror .pin { display: none; }
.unit { position: relative; transform-style: preserve-3d; }
.u3 { position: relative; width: 100%; aspect-ratio: 1000 / 70; transform-style: preserve-3d; }
.u3.fw { aspect-ratio: 1000 / 60; }
.u3 .f { position: absolute; left: 0; top: 0; }
.u3 .front { width: var(--w); height: var(--h); transform: translateZ(calc(var(--d) / 2)); }
.u3 .top { width: var(--w); height: var(--d); top: calc((var(--h) - var(--d)) / 2); transform: rotateX(90deg) translateZ(calc(var(--h) / 2)); border-radius: 4px; background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .55) 0 4px, transparent 4px 12px) 6% 82% / 30% 9% no-repeat, repeating-linear-gradient(90deg, rgba(0, 0, 0, .55) 0 4px, transparent 4px 12px) 64% 82% / 30% 9% no-repeat, linear-gradient(90deg, rgba(255, 255, 255, .05), transparent 40%, rgba(255, 255, 255, .05)), linear-gradient(180deg, #3a3b40, #2a2b2f 30%, #232427); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
.u3 .top::after { content: ""; position: absolute; left: 8%; top: 18%; width: 18%; height: 14%; border-radius: 3px; background: linear-gradient(180deg, #d9d9de, #b9b9bf); opacity: .85; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .08); }
.u3 .bottom { width: var(--w); height: var(--d); top: calc((var(--h) - var(--d)) / 2); transform: rotateX(-90deg) translateZ(calc(var(--h) / 2)); background: #0d0d0f; }
.u3 .side { width: var(--d); height: var(--h); left: calc((var(--w) - var(--d)) / 2); background: radial-gradient(circle, #0b0b0c 1.4px, transparent 1.8px) 0 0 / 9px 9px, linear-gradient(90deg, #1c1d20, #2a2b2f 50%, #18191b); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.u3 .right { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); }
.u3 .left { transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); }
.u3 .back { width: var(--w); height: var(--h); transform: rotateY(180deg) translateZ(calc(var(--d) / 2)); background: #141416; }
.u3 .front svg { filter: none !important; }
.unit svg { direction: ltr; display: block; width: 100%; height: 100%; }
.pins { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.pins .pin { left: 0; top: 0; transition: opacity .4s; }
.pin { position: absolute; display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 11px; border-radius: 999px; background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6); box-shadow: 0 6px 20px rgba(0, 0, 0, .14), inset 0 0 0 .5px var(--line2); font: 500 13px var(--f); white-space: nowrap; color: var(--ink); z-index: 2; }
.pin i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 10px var(--c); }
.pin b { font-weight: 600; font-family: var(--fn); }
.quick { display: flex; justify-content: center; gap: clamp(18px, 4vw, 44px); margin-top: -8px; position: relative; z-index: 2; }
.qa { display: grid; justify-items: center; gap: 10px; font: 500 13.5px var(--f); color: var(--ink2); transition: color .2s; }
.qa:hover { color: var(--ink); }
.qa span.c { width: 62px; height: 62px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--card); color: var(--ink); box-shadow: var(--shadow); transition: transform .5s var(--ease), background-color .3s; }
.qa:hover span.c { transform: translateY(-3px); }
.qa:active span.c { transform: scale(.94); }
.qa.on span.c { background: var(--btn); color: var(--btn-ink); }
.qa .ico { width: 22px; height: 22px; }
.counts { display: flex; justify-content: center; gap: 0; margin: 46px auto 8px; width: 100%; max-width: 760px; }
.counts div { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 4px 8px; }
.counts div + div { border-inline-start: 1px solid var(--line); }
.counts b { font: 500 clamp(30px, 3.4vw, 42px)/1.05 var(--fn); letter-spacing: -.03em; color: var(--c, var(--ink)); }
.counts span { font-size: 14px; color: var(--ink2); white-space: nowrap; }
.lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; margin-top: 30px; align-items: start; }
.group { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
.gtitle { margin: 26px 6px 12px; font: 600 22px var(--f); letter-spacing: -.01em; display: flex; align-items: baseline; justify-content: space-between; }
.gtitle a { font: 500 14px var(--f); color: var(--ink2); text-decoration: none; cursor: pointer; }
.gtitle:first-child { margin-top: 0; }
.row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 20px; text-align: start; position: relative; transition: background-color .2s; }
.row + .row::before { content: ""; position: absolute; top: 0; inset-inline-start: 66px; inset-inline-end: 0; height: 1px; background: var(--line); }
.row:hover { background: var(--card2); }
.row .ri { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--chip); color: var(--ink); flex: none; }
.row .rt { flex: 1; min-width: 0; display: grid; }
.row .rt b { font-weight: 500; font-size: 15.5px; }
.row .rt span { color: var(--ink2); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rv { color: var(--ink2); font: 500 14px var(--fn); }
.row .rv, .prow .dur, .kv dd { unicode-bidi: plaintext; }
.row .chev { color: var(--ink3); }
.row .chev .ico { width: 16px; height: 16px; transform: scaleX(-1); }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--down); color: #fff; font: 600 12.5px var(--fn); display: inline-flex; align-items: center; justify-content: center; }
.sdot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.c-up { --c: var(--up); --cb: var(--up-bg); } .c-warn { --c: var(--warn); --cb: var(--warn-bg); } .c-down { --c: var(--down); --cb: var(--down-bg); } .c-unreach { --c: var(--unreach); } .c-paused { --c: var(--paused); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--cb, var(--chip)); color: var(--c, var(--ink2)); font: 600 12px var(--f); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.stats div { padding: 16px 18px; display: grid; gap: 2px; }
.stats div + div { border-inline-start: 1px solid var(--line); }
.stats b { font: 600 28px/1.1 var(--fn); letter-spacing: -.02em; color: var(--c, var(--ink)); }
.stats span { font-size: 13px; color: var(--ink2); }

/* device */
.dev-hero { display: grid; gap: 6px; margin: 10px 0 0; }
.dev-hero h1 { margin: 0; font: 600 clamp(34px, 4vw, 48px)/1.05 var(--fn); letter-spacing: -.025em; direction: ltr; text-align: right; }
.dev-hero p { margin: 0; color: var(--ink2); }
.dev-stage { height: 300px; margin-top: 18px; }
.dev-stage { perspective: 2600px; }
.dev-stage .stack { width: min(900px, 78%); gap: 16px; transform: rotateX(calc(-14deg + var(--rx))) rotateY(calc(-20deg + var(--ry))); }
.dev-stage { height: 440px; }
.port-hit { cursor: pointer; }
.port-hit:hover rect.hole { stroke: #fff; stroke-width: 1.2; }
.dev-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-top: 24px; align-items: start; }
.rings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ring { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; display: grid; justify-items: center; gap: 8px; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring .tr { fill: none; stroke: var(--chip); stroke-width: 10; }
.ring .v { fill: none; stroke: var(--c); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease); }
.ring .lbl { display: grid; justify-items: center; }
.ring .lbl b { font: 600 22px var(--fn); letter-spacing: -.02em; }
.ring .lbl span { font-size: 13px; color: var(--ink2); }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--chip); margin: 26px 0 12px; }
.seg button { height: 32px; padding: 0 16px; border-radius: 9px; font: 500 14px var(--f); color: var(--ink2); transition: background-color .25s, color .25s, box-shadow .25s; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.sheet .tag { justify-self: start; }
.sheet { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 12px; }
.sheet h3 { margin: 0; font: 600 22px var(--fn); letter-spacing: -.02em; direction: ltr; text-align: right; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; margin: 0; font-size: 14.5px; }
.kv dt { color: var(--ink2); }
.kv dd { margin: 0; text-align: end; font-family: var(--fn); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.pbtn { height: 40px; padding: 0 18px; border-radius: 999px; background: var(--btn); color: var(--btn-ink); font: 500 14.5px var(--f); display: inline-flex; align-items: center; gap: 8px; transition: transform .2s; }
.pbtn:active { transform: scale(.97); }
.sbtn { height: 40px; padding: 0 18px; border-radius: 999px; background: var(--chip); color: var(--ink); font: 500 14.5px var(--f); display: inline-flex; align-items: center; gap: 8px; }
.sbtn.red { color: var(--down); }

/* problems */
.ptitle { margin: 6px 0 18px; font: 600 40px/1.1 var(--f); letter-spacing: -.02em; }
.prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; position: relative; }
.prow + .prow::before { content: ""; position: absolute; top: 0; inset-inline-start: 18px; inset-inline-end: 0; height: 1px; background: var(--line); }
.prow .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--cb); color: var(--c); display: inline-flex; align-items: center; justify-content: center; }
.prow .t { display: grid; gap: 2px; min-width: 0; }
.prow .t b { font: 600 16px var(--fn); direction: ltr; text-align: right; }
.prow .t span { color: var(--ink2); font-size: 14px; }
.prow .e { display: flex; align-items: center; gap: 10px; }
.prow .dur { font: 500 13px var(--fn); color: var(--ink2); }
.ack { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--chip); font: 500 13.5px var(--f); }
.ack.done { color: var(--up); background: var(--up-bg); }

/* toast */
.toast { position: fixed; z-index: 40; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; visibility: hidden; background: var(--btn); color: var(--btn-ink); border-radius: 999px; padding: 12px 20px; font: 500 14px var(--f); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); transition: transform .5s var(--ease), opacity .3s, visibility .3s; }
.toast.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; }


/* ---------- shared page anatomy ---------- */
.pg-h { display: grid; gap: 6px; margin: 4px 0 22px; }
.pg-h h1 { margin: 0; font: 600 clamp(32px, 3.6vw, 44px)/1.08 var(--f); letter-spacing: -.025em; }
.pg-h h1 .lt { font-family: var(--fn); direction: ltr; unicode-bidi: isolate; }
.pg-h p { margin: 0; color: var(--ink2); font-size: 16px; }
.pg-h .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }

function viewOf(name) { return FIXED[name] ? $('#v-' + name) : $('#v-page'); }
function show(to, fwd) {
  const from = $('.view.on'), next = viewOf(to);
  const bare = !!(PAGES[to] && PAGES[to].bare);
  const swap = () => {
    if (to === 'device') { renderDevice(21); renderRings(); }
    if (!FIXED[to]) { next.innerHTML = PAGES[to].html(); }
    from.classList.remove('on'); next.classList.add('on'); document.body.classList.toggle('bare', bare); scrollTo(0, 0); size3d(); document.querySelectorAll('.topo-scroll').forEach(e => { e.scrollLeft = -(e.scrollWidth - e.clientWidth) / 2; });

    if (!reduce) {
      const dx = fwd ? -60 : 60;
      next.animate([{ opacity: 0, transform: `translateX(${dx}px)` }, { opacity: 1, transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.32,.72,0,1)' });
      $$('.stack .unit', next).forEach((u, i) => u.animate([{ transform: 'translateY(50px) translateZ(-200px)' }, { transform: 'none' }], { duration: 1000, delay: 80 + i * 70, easing: 'cubic-bezier(.32,.72,0,1)', fill: 'backwards' }));
    }
  };
  if (reduce || from === next) { if (from === next && !reduce) next.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160 }).onfinish = swap; else swap(); return; }
  from.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${fwd ? 30 : -30}px) scale(.985)` }], { duration: 240, easing: 'cubic-bezier(.32,.72,0,1)' }).onfinish = swap;
}
