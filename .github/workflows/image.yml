name: Image

# Publishes a ready-to-run container image to GitHub Container Registry on every push to
# main or a phase* branch, so a host that cannot download npm/PyPI packages (corporate
# proxies) can `docker compose pull` instead of building:
#   ghcr.io/<owner>/<repo>:latest       (main)
#   ghcr.io/<owner>/<repo>:<branch>     (e.g. phase2)
#   ghcr.io/<owner>/<repo>:sha-<short>  (every build)
# Version tags (v*) are published by release.yml (amd64).
on:
  push:
    branches: ["main", "phase*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          IMG="${{ steps.name.outputs.image }}:sha-${GITHUB_SHA::7}"
          docker pull "$IMG"
          docker run --rm --entrypoint netmon "$IMG" --help >/dev/null
          docker run --rm --entrypoint python "$IMG" -c "import netmon, pathlib; p = pathlib.Path(netmon.__file__).parent / 'static' / 'index.html'; assert p.is_file(), p; print('ok', p)"
          # [2b-3] AD login dependency and the unprivileged in-container ingest ports.
          docker run --rm --entrypoint python "$IMG" -c "import os, ldap3; assert os.environ['NETMON_TRAP_PORT'] == '1162' and os.environ['NETMON_SYSLOG_PORT'] == '1514'; print('ok ldap3', ldap3.__version__)"
          # [3] Flow ports (published 1:1), Kerberos (gssapi against libgssapi-krb5-2), asyncssh,
          # and a consistent venv.
          docker run --rm --entrypoint python "$IMG" -c "import os; assert (os.environ['NETMON_NETFLOW_PORT'], os.environ['NETMON_IPFIX_PORT'], os.environ['NETMON_SFLOW_PORT']) == ('2055', '4739', '6343'); import asyncssh, gssapi.raw; print('ok asyncssh', asyncssh.__version__, '/ gssapi')"
          docker run --rm --entrypoint pip "$IMG" check
          docker image inspect -f '{{json .Config.ExposedPorts}}' "$IMG" | python3 -c "import json, sys; p = json.load(sys.stdin); missing = {'2055/udp', '4739/udp', '6343/udp'} - set(p); assert not missing, missing; print('exposed', sorted(p))"
          echo "Published: ${{ steps.meta.outputs.tags }}" | tr '\n' ' '
