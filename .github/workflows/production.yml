name: Production config

# Validates deploy/production/ (the GitOps folder the production server deploys from):
# shellcheck, release.env format + version/image consistency (never :latest), compose
# config, Caddyfile, systemd units, the sync.sh decision logic (fake docker), [3b] the
# assistant network helper and the IAM policy templates in aws/.
# Every PR (no path filter): `validate` is a required status check in the main ruleset, and a
# required check that never runs blocks the merge. It takes about a minute.
on:
  push:
    branches: ["main"]
    paths: ["deploy/production/**", ".github/workflows/production.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/production
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck --version | head -n2
          shellcheck -x ops/*.sh tests/*.sh tests/fake-bin/*

      - name: release.env (format, version == image tag, pinned digest, no latest)
        run: ops/check-release.sh release.env

      # [1.4.2] Static review item 12: a CA file in deploy/certs/ is baked into the image's
      # trust store (every TLS connection of the build and of the app would trust it). Only
      # the documented placeholders may be committed; .github/CODEOWNERS must keep covering
      # the deploy and workflow paths.
      - name: Repository guards (no committed CA, CODEOWNERS)
        working-directory: .
        run: |
          set -eu
          extra="$(git ls-files deploy/certs | grep -vxE 'deploy/certs/(README\.md|\.gitignore)' || true)"
          if [ -n "$extra" ]; then
            echo "::error::files under deploy/certs/ must not be committed (site-specific CAs are baked into the image):"
            echo "$extra"
            exit 1
          fi
          for p in /deploy/production/ /.github/workflows/ /deploy/certs/; do
            grep -qE "^${p}[[:space:]]+@" .github/CODEOWNERS || { echo "::error::.github/CODEOWNERS lacks $p"; exit 1; }
          done
          echo "deploy/certs: placeholders only; CODEOWNERS covers deploy/production, workflows, certs"

      - name: docker compose config
        run: |
          docker compose version
          mkdir -p "$RUNNER_TEMP/etc"
          NETMON_ETC_DIR="$RUNNER_TEMP/etc" docker compose -f compose.yaml --env-file release.env config -q
          NETMON_ETC_DIR="$RUNNER_TEMP/etc" docker compose -f compose.yaml --env-file release.env config --images

      - name: Caddyfile (caddy validate with a throwaway cert)
        run: |
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=netmonitor.example.local \
            -keyout "$tls/key.pem" -out "$tls/cert.pem" 2>/dev/null
          img="$(NETMON_ETC_DIR=/x docker compose -f compose.yaml --env-file release.env config --images | grep '^caddy:')"
          docker run --rm -e NETMON_FQDN=netmonitor.example.local \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$tls:/etc/caddy/tls:ro" \
            "$img" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: systemd units
        run: |
          d="$RUNNER_TEMP/units"
          mkdir -p "$d"
          for f in systemd/*; do sed "s#/usr/local/lib/netmon-gitops/#$PWD/ops/#" "$f" >"$d/$(basename "$f")"; done
          (cd "$d" && systemd-analyze verify ./*.service ./*.timer)

      - name: sync.sh logic (fake docker)
        run: tests/test-sync.sh

      - name: install-cert.sh (PEM/DER/PKCS7 chains, leaf found by key, root left out)
        run: tests/test-install-cert.sh

      # [3b] Assistant: NO_PROXY routing helper and the IAM policy templates (JSON, least
      # privilege, render-policies.py).
      - name: assistant-net.sh + aws/ IAM policies
        run: |
          for f in aws/*.json; do python3 -m json.tool "$f" >/dev/null || { echo "::error file=deploy/production/$f::invalid JSON"; exit 1; }; done
          python3 -m py_compile aws/render-policies.py
          tests/test-assistant-net.sh
