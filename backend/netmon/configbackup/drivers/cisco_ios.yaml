id: cisco_ios
name: 'Cisco IOS / IOS-XE'
version: 1
confidence: unverified
priority: 300
match:
  templates: ['cisco_ios']
  sys_object_id: ['1.3.6.1.4.1.9.1.']
mode: shell
prompt: '^[\w.\-:/]{1,64}[>#] ?$'
pre_prompt: []
enable:
  when: '>\s*$'
  command: 'enable'
  password_prompt: '[Pp]assword:\s*$'
session_setup: ['terminal length 0', 'terminal width 0']
commands:
  - command: 'show running-config'
error_patterns: ['^\s*% (Invalid input|Incomplete command|Ambiguous command)']
ignore_lines:
  - '^! (Last configuration change|NVRAM config last updated) at'
  - '^Building configuration'
  - '^Current configuration : \d+ bytes'
  - '^ntp clock-period'
secrets:
  - '^\s*enable (?:secret|password)(?: \d)? (\S+)'
  - '^\s*username \S+ .*?(?:secret|password)(?: \d)? (\S+)'
  - '^\s*snmp-server community (\S+)'
  - '^\s*snmp-server host \S+ (?:informs |traps )?(?:version (?:1|2c|3 \S+) )?(\S+)'
  - '\bpre-shared-key(?: (?:local|remote))?(?: \d)? (\S+)'
  - '\bkey(?:-string)?(?: \d+)?(?: md5)?(?: \d)? (\S+)'
  - '(?<![\w-])password(?: \d)? (\S+)'
  - '\bauth (?:md5|sha\S*) (\S+)'
  - '\bpriv (?:des\S*|3des|aes(?: \d+)?) (\S+)'
notes: ''
