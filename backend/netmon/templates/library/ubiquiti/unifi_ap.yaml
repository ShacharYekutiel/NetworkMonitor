# UniFi access point (UBNT-UniFi-MIB unifiVapTable).
schema: 1
id: unifi_ap
version: 1
vendor: ubiquiti
verified: false
verified_note: ""
name: {en: "UniFi access point", he: "נקודת גישה UniFi"}
description:
  en: "Ping, system, CPU, memory, uplink port and clients per SSID/radio"
  he: "פינג, מערכת, מעבד, זיכרון, פורט Uplink ולקוחות לכל SSID/רדיו"
requires_snmp: true
priority: 80
match:
  - {device_classes: [access_point], vendors: [ubiquiti], requires_snmp: true}
entries:
  - {kind: sensor, type: ping, name: {en: Ping, he: פינג}}
  - {kind: sensor, type: snmp_system, name: {en: System, he: מערכת}}
  - {kind: sensor, type: snmp_cpu, name: {en: CPU Load, he: עומס מעבד}, probe: true}
  - {kind: sensor, type: snmp_memory, name: {en: Memory, he: זיכרון}, probe: true}
  - kind: snmp_interfaces
    oper_up_only: true
    exclude_if_types: [24]
    include_name_regex: '^eth0$'
    exclude_name_regex: null
    max: 1
    notes: "The uplink port only."
  - kind: snmp_table
    walk_oid: '1.3.6.1.4.1.41112.1.6.1.2.1.8'     # unifiVapNumStations
    label_oid: '1.3.6.1.4.1.41112.1.6.1.2.1.6'    # unifiVapEssId
    label2_oid: '1.3.6.1.4.1.41112.1.6.1.2.1.9'   # unifiVapRadio (ng / na), medium
    name: {en: 'Clients {label}', he: 'לקוחות {label}'}
    config: {value_type: gauge, unit: clients}
    max: 16
    confidence: high
    notes: "One VAP row per SSID per radio, e.g. 'Clients HomeWiFi (na)'. unifiVapRadio: medium."
