# Fortinet FortiGate (FORTINET-FORTIGATE-MIB 1.3.6.1.4.1.12356.101).
schema: 1
id: fortinet_fortigate
version: 1
vendor: fortinet
verified: false
verified_note: ""
name: {en: "Fortinet FortiGate firewall", he: "חומת אש Fortinet FortiGate"}
description:
  en: "Ping, system, CPU, memory, sessions, disk, HA and VPN tunnels"
  he: "פינג, מערכת, מעבד, זיכרון, סשנים, דיסק, HA ומנהרות VPN"
requires_snmp: true
priority: 50
match:
  - {requires_snmp: true, enterprises: [12356]}
entries:
  - {kind: sensor, type: ping, name: {en: Ping, he: פינג}}
  - {kind: sensor, type: snmp_system, name: {en: System, he: מערכת}}
  - kind: sensor
    type: snmp_custom
    name: {en: CPU, he: מעבד}
    config: {oid: '1.3.6.1.4.1.12356.101.4.1.3.0', value_type: gauge, unit: '%', label: CPU}
    channels: [{key: value, warning_max: 80, down_max: 95}]
    probe: true
    confidence: high
    notes: "fgSysCpuUsage."
  - kind: sensor
    type: snmp_custom
    name: {en: Memory, he: זיכרון}
    config: {oid: '1.3.6.1.4.1.12356.101.4.1.4.0', value_type: gauge, unit: '%', label: Memory}
    channels: [{key: value, warning_max: 85, down_max: 95}]
    probe: true
    confidence: high
    notes: "fgSysMemUsage."
  - kind: sensor
    type: snmp_custom
    name: {en: Sessions, he: סשנים}
    config: {oid: '1.3.6.1.4.1.12356.101.4.1.8.0', value_type: gauge, unit: sessions, label: Sessions}
    probe: true
    confidence: high
    notes: "fgSysSesCount."
  - kind: sensor
    type: snmp_custom
    name: {en: Disk, he: דיסק}
    config:
      oid: '1.3.6.1.4.1.12356.101.4.1.6.0'            # fgSysDiskUsage
      percent_of_oid: '1.3.6.1.4.1.12356.101.4.1.7.0' # fgSysDiskCapacity
      value_type: gauge
      unit: '%'
      label: Disk
    channels: [{key: value, warning_max: 85, down_max: 95}]
    probe: true
    confidence: high
    notes: "Capacity 0 (no disk) -> no value."
  - kind: sensor
    type: snmp_custom
    name: {en: HA mode, he: מצב HA}
    config:
      oid: '1.3.6.1.4.1.12356.101.13.1.1.0'           # fgHaSystemMode
      value_type: enum
      value_map:
        1: {status: up, text: standalone}
        2: {status: up, text: active-active}
        3: {status: up, text: active-passive}
      value_map_default: warning
      label: HA
    probe: true
    confidence: high
  - kind: snmp_table
    walk_oid: '1.3.6.1.4.1.12356.101.13.2.1.1.12'     # fgHaStatsSyncStatus
    label_oid: '1.3.6.1.4.1.12356.101.13.2.1.1.11'    # fgHaStatsHostname
    name: {en: 'HA sync {label}', he: 'סנכרון HA {label}'}
    config:
      value_type: enum
      value_map:
        0: {status: warning, text: unsynchronized}
        1: {status: up, text: synchronized}
      value_map_default: warning
    max: 8
    confidence: medium
  - kind: sensor
    type: snmp_walk_count
    name: {en: VPN tunnels up, he: מנהרות VPN פעילות}
    config: {oid: '1.3.6.1.4.1.12356.101.12.2.2.1.20', count_values: [2], label: VPN tunnels up}
    channels: [{key: unmatched, warning_max: 0}]
    probe: true
    confidence: medium
    notes: "fgVpnTunEntStatus: down(1), up(2)."
  - {kind: snmp_interfaces, oper_up_only: true, exclude_if_types: [1, 24, 53, 131, 136], max: 32}
