[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netmon"
dynamic = ["version"]
description = "NetworkMonitor - a license-free, PRTG-like network monitor"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # [1.5.0] floors = the latest releases when 1.5.0 was prepared (every release ships on the
    # latest packages that break nothing; see the 1.5.0 dependency-upgrade commits).
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32",
    "alembic>=1.20.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",  # [1.4.2] floors at the patched releases (pip-audit; PR 1.4.2)
    "argon2-cffi>=25.1",
    "pysnmp>=7.1.34",
    # pysnmp 7 needs the `cryptography` package for SNMPv3 privacy (authPriv: AES/DES).
    # Without it every encrypted v3 query fails with EncryptionError("Ciphering services
    # not available"). >=43 provides hazmat.decrepit.ciphers.modes.CFB, which pysnmp imports.
    "cryptography>=50.0.2",
    "icmplib>=3.0.4",
    "httpx>=0.28.1",
    "dnspython>=2.9.2",
    "aiosmtplib>=5.1.3",
    # OS trust store (Windows certificate store, macOS Keychain, Linux system bundle)
    # so corporate TLS-inspection CAs are trusted; see netmon/tlsutil.py.
    "truststore>=0.10.5",
    # [2b-1] IANA zone database for zoneinfo (Windows and slim images have none)
    "tzdata>=2026.6",
    # [2b-2] template library files (yaml.safe_load only)
    "PyYAML>=6.0.4",
    # [2b-3] Active Directory login (pure Python, LGPL-3.0, used unmodified as a library)
    "ldap3>=2.9.1",
    # [3] config backup over SSH (EPL-2.0 OR GPL-2.0-or-later; used unmodified under EPL-2.0)
    "asyncssh[bcrypt]>=2.24.1",
    # [1.3.3] RE2 (BSD-3-Clause) linear-time regex engine for untrusted event-rule and
    # config-backup-search patterns; removes the ReDoS class on the unauthenticated ingest
    # path. Ships manylinux wheels that bundle libre2, so no apt packages are needed.
    "google-re2>=1.1.20251105",
]

[project.optional-dependencies]
# [3] Kerberos SSO acceptor (python-gssapi, ISC; needs MIT krb5 libgssapi-krb5-2). Imported
# lazily: the app runs without it (feature state "unavailable").
kerberos = ["gssapi>=1.12"]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff>=0.17.6",
    "dnslib>=0.9.26",
    "aiosmtpd>=1.4.6",
    "snmpsim>=1.2.2",
    "pysmi>=2.0",
    # [3b] test-only: the Bedrock mock (tests/sim/bedrock) verifies SigV4 with botocore (architecture §14.1)
    "botocore>=1.44.11",
]

[project.scripts]
netmon = "netmon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "netmon.__version__" }

[tool.setuptools.packages.find]
include = ["netmon*"]

[tool.setuptools.package-data]
netmon = [
    "static/*",
    "static/**/*",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "templates/library/*/*.yaml",
    "data/*.gz",
    "data/*.tsv",
    "configbackup/drivers/*.yaml",
    "assistant/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
