[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netmon"
dynamic = ["version"]
description = "NetworkMonitor - a license-free, PRTG-like network monitor"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.15",  # [1.4.2] floors at the patched releases (pip-audit; PR 1.4.2)
    "argon2-cffi>=23.1",
    "pysnmp>=7.1",
    # pysnmp 7 needs the `cryptography` package for SNMPv3 privacy (authPriv: AES/DES).
    # Without it every encrypted v3 query fails with EncryptionError("Ciphering services
    # not available"). >=43 provides hazmat.decrepit.ciphers.modes.CFB, which pysnmp imports.
    "cryptography>=50",
    "icmplib>=3.0",
    "httpx>=0.27",
    "dnspython>=2.9",
    "aiosmtplib>=5.1.2",
    # OS trust store (Windows certificate store, macOS Keychain, Linux system bundle)
    # so corporate TLS-inspection CAs are trusted; see netmon/tlsutil.py.
    "truststore>=0.10",
    # [2b-1] IANA zone database for zoneinfo (Windows and slim images have none)
    "tzdata>=2024.1",
    # [2b-2] template library files (yaml.safe_load only)
    "PyYAML>=6.0.1",
    # [2b-3] Active Directory login (pure Python, LGPL-3.0, used unmodified as a library)
    "ldap3>=2.9.1",
    # [3] config backup over SSH (EPL-2.0 OR GPL-2.0-or-later; used unmodified under EPL-2.0)
    "asyncssh[bcrypt]>=2.24",
    # [1.3.3] RE2 (BSD-3-Clause) linear-time regex engine for untrusted event-rule and
    # config-backup-search patterns; removes the ReDoS class on the unauthenticated ingest
    # path. Ships manylinux wheels that bundle libre2, so no apt packages are needed.
    "google-re2>=1.1",
]

[project.optional-dependencies]
# [3] Kerberos SSO acceptor (python-gssapi, ISC; needs MIT krb5 libgssapi-krb5-2). Imported
# lazily: the app runs without it (feature state "unavailable").
kerberos = ["gssapi>=1.8"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "dnslib>=0.9.17",
    "aiosmtpd>=1.4.6",
    "snmpsim>=1.1",
    "pysmi>=1.5",
    # [3b] test-only: the Bedrock mock (tests/sim/bedrock) verifies SigV4 with botocore (architecture §14.1)
    "botocore>=1.34",
]

[project.scripts]
netmon = "netmon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "netmon.__version__" }

[tool.setuptools.packages.find]
include = ["netmon*"]

[tool.setuptools.package-data]
netmon = [
    "static/*",
    "static/**/*",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "templates/library/*/*.yaml",
    "data/*.gz",
    "data/*.tsv",
    "configbackup/drivers/*.yaml",
    "assistant/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
